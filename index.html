    try { const t = localStorage.getItem('signal-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M5 21h5l3-9 4 13 3-8h7"/></svg>
        </span>
        <span class="brand-text"><strong>Signal</strong><small>DE &amp; Viz midterm</small></span>

      <nav id="nav"></nav>
      <div class="side-progress" id="sideProgress"></div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"><i class="ph ph-list"></i></button>
